name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        golang: ["1.26.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ matrix.golang }}"
          check-latest: true

      - run: go build ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: go test ./...

      - name: Check generated arithmetic
        run: go run ./internal/cmd/genarith -check

      - name: Race detector
        run: go test -race ./...

      - name: Cross-build linux/amd64
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64

      - name: Cross-build linux/arm64
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64

      - name: Cross-build linux/386
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: "386"

      - name: Cross-build js/wasm
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm

      - run: git diff --check
